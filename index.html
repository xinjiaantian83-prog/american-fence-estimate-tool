<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>アメリカンフェンス概算見積ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>アメリカンフェンス概算見積</h1>
      <p>材料販売価格をすばやく回答する内部ツール</p>
    </header>

    <section class="summary-grid" aria-label="見積結果">
      <article class="total-card">
        <span>税込価格</span>
        <strong id="customerTotalTaxIn">¥0</strong>
      </article>
      <article class="metric-card">
        <span>税別</span>
        <strong id="customerTotal">0円</strong>
      </article>
      <article class="metric-card">
        <span>粗利</span>
        <strong id="profit">0円</strong>
      </article>
      <article class="metric-card">
        <span>粗利率</span>
        <strong id="profitRate">0.0%</strong>
      </article>
    </section>

    <section class="card input-card" aria-labelledby="inputTitle">
      <div class="section-head">
        <h2 id="inputTitle">入力</h2>
      </div>

      <fieldset class="shape-picker">
        <legend>平面形状</legend>
        <button class="shape-button" type="button" data-shape="line">
          <span class="shape-icon shape-line" aria-hidden="true"></span>
          <strong>直線</strong>
        </button>
        <button class="shape-button" type="button" data-shape="u">
          <span class="shape-icon shape-u" aria-hidden="true"></span>
          <strong>コの字</strong>
        </button>
        <button class="shape-button" type="button" data-shape="box">
          <span class="shape-icon shape-box" aria-hidden="true"></span>
          <strong>四角</strong>
        </button>
      </fieldset>

      <div class="quantity-list">
        <label class="quantity-row" for="panel1500">
          <span class="quantity-label">
            <strong>1500×900パネル</strong>
            <small>通常フェンスパネル</small>
          </span>
          <span class="stepper">
            <button type="button" data-step-target="panel1500" data-step="-1" aria-label="1500×900パネルを減らす">−</button>
            <input id="panel1500" type="number" inputmode="numeric" min="0" step="1">
            <button type="button" data-step-target="panel1500" data-step="1" aria-label="1500×900パネルを増やす">＋</button>
          </span>
        </label>

        <label class="quantity-row" for="panel900">
          <span class="quantity-label">
            <strong>通常900×900パネル</strong>
            <small>門扉用パネルは含めない</small>
          </span>
          <span class="stepper">
            <button type="button" data-step-target="panel900" data-step="-1" aria-label="通常900×900パネルを減らす">−</button>
            <input id="panel900" type="number" inputmode="numeric" min="0" step="1">
            <button type="button" data-step-target="panel900" data-step="1" aria-label="通常900×900パネルを増やす">＋</button>
          </span>
        </label>

        <label class="quantity-row" for="gates">
          <span class="quantity-label">
            <strong>片開き門扉</strong>
            <small>1個につき900×900を1枚追加</small>
          </span>
          <span class="stepper">
            <button type="button" data-step-target="gates" data-step="-1" aria-label="片開き門扉を減らす">−</button>
            <input id="gates" type="number" inputmode="numeric" min="0" step="1">
            <button type="button" data-step-target="gates" data-step="1" aria-label="片開き門扉を増やす">＋</button>
          </span>
        </label>
      </div>

      <button id="resetButton" class="ghost-button full-button" type="button">リセット</button>
    </section>

    <section class="sub-metrics" aria-label="詳細金額">
      <article class="metric-card">
        <span>定価合計・税別</span>
        <strong id="listTotal">0円</strong>
      </article>
      <article class="metric-card">
        <span>仕入合計・税別</span>
        <strong id="costTotal">0円</strong>
      </article>
    </section>

    <section class="card" aria-labelledby="partsTitle">
      <div class="section-head">
        <h2 id="partsTitle">使用部材</h2>
      </div>

      <div id="partsList" class="parts-list" aria-label="使用部材一覧"></div>

      <p class="notice">表示価格はアメリカンフェンス材料のみの概算価格です。人工芝、基礎工事、フェンス設置費、その他施工費は含まれていません。</p>
    </section>

    <section class="card reply-card" aria-labelledby="replyTitle">
      <div class="section-head">
        <h2 id="replyTitle">返信文</h2>
      </div>
      <textarea id="replyText" readonly></textarea>
      <button id="copyButton" class="primary-button full-button" type="button">コピー</button>
      <p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
